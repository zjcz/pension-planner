server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: pension-planner
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

pension-planner:
  jwt:
    secret: ${JWT_SECRET:}
    ttl-seconds: ${JWT_TTL_SECONDS:604800}
    cookie-name: pp_jwt
    secure: ${COOKIE_SECURE:false}
  rate-limit:
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    capacity: ${AUTH_RATE_LIMIT_CAPACITY:20}
    refill-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
